<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>A PUNTO Viandas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --fondo: #F7F3EE;
      --texto: #2F3E3A;
      --acento: #D8A48F;
      --tarjeta: #FFFFFF;
      --borde: #E6E1DA;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
    }

    header {
      text-align: center;
      padding: 30px 20px;
    }

    header img {
      max-width: 260px;
      margin-bottom: 16px;
    }

    header p {
      font-size: 14px;
      opacity: 0.8;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .seccion {
      margin-bottom: 30px;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .tarjeta {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    label {
      font-size: 13px;
      display: block;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--borde);
      font-size: 14px;
      margin-bottom: 10px;
    }

    textarea {
      resize: none;
      height: 70px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--acento);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .vacio {
      text-align: center;
      font-size: 14px;
      opacity: 0.6;
      padding: 30px 10px;
    }

/* ===== AJUSTES ESTÉTICOS MENÚ ===== */

.vianda-btn {
  width: 100%;
  text-align: left;
  font-size: 16px;          /* 🔹 agranda el nombre */
  font-weight: 600;
  padding: 10px 14px;
  border-radius: 10px;
  background: #ffffff;
  border: 1px solid var(--borde);
  cursor: pointer;
}

.vianda-contenido {
  display: none;
  margin-top: 10px;
}

/* Labels más sutiles */
.vianda label {
  font-size: 12px;
  margin-top: 6px;
}

/* Inputs más compactos */
.vianda select,
.vianda input[type="number"] {
  padding: 6px 8px;         /* 🔹 achica altura */
  font-size: 14px;
}

/* Observaciones MÁS CHICO */
.vianda textarea {
  height: 45px;             /* 🔹 clave */
  font-size: 13px;
  padding: 6px 8px;
  resize: none;
}

* {
  box-sizing: border-box;
}

.vianda-contenido {
  display: none;
}

.vianda-contenido.abierto {
  display: block;
}
  </style>
</head>

<body>

<header>
  <!-- CUANDO QUIERAS, REEMPLAZÁ EL SRC POR TU LOGO -->

<div class="seccion">

</div>

  <div class="seccion">
    <h2>🧍 Datos del cliente</h2>

      <label>Observaciones</label>
      <textarea id="obs"></textarea>

      <label>Forma de pago</label>
      <select id="pago">
        <option value="Efectivo">Efectivo</option>
        <option value="Transferencia">Transferencia</option>
      </select>
    </div>
  </div>

  <button class="btn" onclick="finalizarPedido()">
    Finalizar pedido por WhatsApp
  </button>

<script>
const WHATSAPP_NUMBER = "5491136278233";

function toggleMenu(btn) {
  const contenido = btn.parentElement.querySelector(".vianda-contenido");
  contenido.classList.toggle("abierto");
}

function calcularTotal() {
  let total = 0;

  document.querySelectorAll(".vianda").forEach(v => {
    const precio = parseInt(v.dataset.precio || 0);
    const cantidad = parseInt(v.querySelector(".cantidad").value || 0);
    total += precio * cantidad;
  });

  document.getElementById("total").innerText = `$${total}`;
}

function finalizarPedido() {
  let mensaje =
    "Hola! \u{1F44B}\n" +
    "Quiero hacer un pedido en A PUNTO VIANDAS.\n\n" +
    "\u{1F37D} Pedido:\n";

  let hayPedido = false;

  document.querySelectorAll(".vianda").forEach(v => {
    const nombre = v.querySelector(".vianda-btn").innerText;
    const cantidad = v.querySelector(".cantidad").value;
    const obs = v.querySelector(".obs-vianda").value;
    const sub = v.querySelector(".subopcion");
    const esVeggie = v.classList.contains("veggie");

    if (cantidad > 0) {
      hayPedido = true;
      mensaje += `- ${cantidad}x ${nombre}`;
      if (sub) mensaje += ` (${sub.value})`;
      if (esVeggie) mensaje += " \u{1F331} Veggie";
      mensaje += "\n";
      if (obs) mensaje += `  \u{270F}\u{FE0F} Obs: ${obs}\n`;
    }
  });

  if (!hayPedido) {
    alert("Elegí al menos una vianda");
    return;
  }

  const nombre = document.getElementById("nombre").value;
  const direccion = document.getElementById("direccion").value;
  const pago = document.getElementById("pago").value;

  mensaje +=
    "\n\u{1F4CD} Datos:\n" +
    `Nombre: ${nombre}\n` +
    `Dirección: ${direccion}\n` +
    `Forma de pago: ${pago}\n\n` +
    "¡Gracias! \u{1F331}";

  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

const baseUrl = isMobile
  ? "https://api.whatsapp.com/send"
  : "https://web.whatsapp.com/send";

window.open(
  `${baseUrl}?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(mensaje)}`,
  "_blank"
);

}

</script>
